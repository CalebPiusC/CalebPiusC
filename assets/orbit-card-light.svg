<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" role="img"><title>ORBIT — open-source, cloud-based coding agent. Status: in progress.</title><rect x="0.5" y="0.5" width="879" height="391" rx="16" fill="#FFFFFF" stroke="#E3E3E3" stroke-width="1"/><text x="40" y="66" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="2" fill="#0D0D0D">ORBIT</text><circle cx="716" cy="58" r="5" fill="#C87533"/><text x="730" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2" fill="#0D0D0D">IN PROGRESS</text><rect x="40" y="84" width="64" height="2" fill="#C87533"/><text x="40" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0D0D0D">Open-source, cloud-based coding agent for people moving to the</text><text x="40" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0D0D0D"><tspan fill="#C87533">command</tspan> line.</text><text x="40" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#555555">Forked from opencode  |  Base model: Gemini  |  CLI first</text><line x1="40" y1="210" x2="840" y2="210" stroke="#E3E3E3" stroke-width="1"/><text x="40" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="3" fill="#6E6E6E">ROADMAP</text><text x="40" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#0D0D0D">1</text><text x="72" y="262" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0D0D0D">CLI core<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" dx="14" fill="#0D0D0D">← current</tspan></text><text x="40" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#555555">2</text><text x="72" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555">Newcomer track<tspan font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" dx="10" fill="#6E6E6E">(one-line install, doctor command, guided first run)</tspan></text><text x="40" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#555555">3</text><text x="72" y="322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555">Graphical frontend</text><text x="40" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#555555">4</text><text x="72" y="352" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555">Figma and other integrations</text></svg>
